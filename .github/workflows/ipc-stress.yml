# TEMPORARY (branch ipc-arm64): TestUnicode.testIPC's process round trips on
# arm64, many times, with this branch's build (fix) and the same source
# without the dmb ishst (nofix); the barrier's cost (self-compile, three
# HaxeBenchmarks cases, interleaved). Removed before the branch is merged.
name: ipc-stress

on:
  workflow_dispatch:
    inputs:
      sysruns: {description: TestUnicode runs per copy (six copies), default: "170"}
      rounds: {description: bench rounds, default: "15"}
  push:
    branches: [ipc-arm64]
    paths: [".github/workflows/ipc-stress.yml", ".github/ipc-stress/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: fix
        run: |
          set -e
          make release TARGET=linux-arm64
          mkdir -p ab/fix
          cp bin/release/linux-arm64/haxe ab/fix/haxe
          bin/hxmc/hxmc -cp hxmc/test -cp haxe/test --run Bench --setup -t hxmc
          bash .github/ipc-stress/benchbuild.sh . bin/hxmc/hxmc ab/fix
          cp -r bin/bench/runner ab/runner
      - name: nofix (the same source without the dmb ishst)
        run: |
          set -e
          grep -q 'if (i.release) emit(DMB).cond = 1;' hxmc/src/hxmc/a64/Isel.hx
          sed -i 's/if (i.release) emit(DMB).cond = 1;//' hxmc/src/hxmc/a64/Isel.hx
          make release TARGET=linux-arm64
          mkdir -p ab/nofix
          cp bin/release/linux-arm64/haxe ab/nofix/haxe
          bash .github/ipc-stress/benchbuild.sh . bin/hxmc/hxmc ab/nofix
          ls -l ab/fix ab/nofix
          for f in haxe binarytrees json formatter; do ! cmp -s ab/fix/$f ab/nofix/$f || { echo "$f: identical"; exit 1; }; done
      - run: tar -cf ab.tar ab
      - uses: actions/upload-artifact@v7
        with: {name: ab-arm64, path: ab.tar, retention-days: 3}

  bench:
    needs: build
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        machine: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with: {name: ab-arm64}
      - run: tar -xf ab.tar
      - name: fix vs nofix, interleaved (medians)
        run: bash .github/ipc-stress/bench.sh "$PWD" "$PWD/ab" ${{ inputs.rounds || '15' }}
        timeout-minutes: 60

  stress:
    needs: build
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        bin: [fix]
        shard: [1, 2, 3, 4, 5, 6]
        include:
          - {bin: nofix, shard: 1}
          - {bin: nofix, shard: 2}
    env:
      PLATFORM: linux-arm64
      HAXE_STD_PATH: ${{ github.workspace }}/haxe/upstream/std
      SYSRUNS: ${{ inputs.sysruns || '170' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: ./haxe/upstream/.github/actions/setup-neko
      - uses: actions/download-artifact@v8
        with: {name: ab-arm64}
      - name: haxe on PATH
        run: |
          set -ex
          tar -xf ab.tar
          mkdir -p hbin
          cp ab/${{ matrix.bin }}/haxe hbin/haxe
          chmod +x hbin/haxe
          sudo ln -sf "$PWD/hbin/haxe" /usr/local/bin/haxe
          haxe -version
          git clone -q --depth 1 https://github.com/haxe-utest/utest.git "$RUNNER_TEMP/utest"
      - name: TestUnicode alone, six copies at once
        run: |
          pids=
          for c in 1 2 3 4 5 6; do
            bash .github/ipc-stress/sysloop.sh "$PWD" "$RUNNER_TEMP/utest" "$RUNNER_TEMP/sys$c" $SYSRUNS > "$RUNNER_TEMP/sys$c.log" 2>&1 &
            pids="$pids $!"
          done
          for p in $pids; do wait $p || true; done
          cat "$RUNNER_TEMP"/sys?.log | grep -av "^\s*$" | grep -v "^113:"
          cat "$RUNNER_TEMP"/sys?.log | grep -a "^sysloop" | awk '{r += $3; f += $5} END {print "TOTAL: " r " runs, " f " failures"}'
        timeout-minutes: 90
