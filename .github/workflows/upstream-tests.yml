# Upstream Haxe's CI test suite (haxe/.github/workflows/main.yml: the jobs
# linux-test, mac-test and windows64-test) with the port as `haxe`.
#
# Called by build.yml once its `build` and `cosmo` jobs have uploaded the
# release binaries; nothing is rebuilt here. Each job puts the release binary
# on PATH as `haxe` with HAXE_STD_PATH at the submodule's std, builds haxelib
# from haxe/extra/haxelib_src with that binary (client.hxml to run.n, then
# `nekotools boot` as upstream's Makefile does), and runs
# `haxe --run RunCi <target>` in haxe/tests, straight from the submodule.
# The steps follow upstream's jobs; the differences are commented.
#
# Upstream's windows64-test has no counterpart: the Windows build of the port
# is the Cosmopolitan binary, whose Eval host sees a POSIX system
# (Sys.systemName() "Linux", /D/a/... paths), so RunCi and the programs it
# starts disagree on paths and commands (test/README.md).
name: upstream-tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-test:
    runs-on: ubuntu-22.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
    env:
      PLATFORM: linux${{ matrix.arch == 'arm64' && '-arm' || '' }}64
      HXCPP_COMPILE_CACHE: ${{ github.workspace }}/hxcache
      # upstream: /usr/local/share/haxe/std (a link to the package's std)
      HAXE_STD_PATH: ${{ github.workspace }}/haxe/std
    strategy:
      fail-fast: false
      matrix:
        target: [macro, js, hl, cpp, jvm, php, python, lua, flash, neko]
        arch: [x86, arm64]
        include:
          - target: hl
            arch: x86
            APT_PACKAGES: cmake ninja-build libturbojpeg-dev
          - target: hl
            arch: arm64
            APT_PACKAGES: cmake ninja-build libturbojpeg-dev
            runci-args: --skip-hl-jit
          - target: cpp
            arch: x86
            APT_PACKAGES: gcc-multilib g++-multilib
          - target: lua
            APT_PACKAGES: ncurses-dev
          - target: flash
            APT_PACKAGES: libglib2.0-0 libgtk2.0-0 libfreetype6 xvfb
        exclude:
          - target: flash
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: haxe-in-haxe-linux-${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
          path: linuxBinaries

      - uses: ./haxe/.github/actions/setup-neko

      - name: Setup Haxe
        run: |
          # upstream's haxe links mbedtls dynamically; the port's links it statically,
          # but HashLink's build (runci's hl target) needs the headers
          sudo apt install -qqy libmbedtls-dev

          set -ex
          tar -xf linuxBinaries/*.tar.gz -C linuxBinaries --strip-components=1
          sudo mkdir -p /usr/local/bin/
          sudo ln -s `pwd`/linuxBinaries/haxe-in-haxe /usr/local/bin/haxe

      # upstream's linux-build job (make haxelib), with the port as haxe
      - name: Build haxelib
        working-directory: ${{ github.workspace }}/haxe/extra/haxelib_src
        run: |
          set -ex
          haxe client.hxml
          nekotools boot -c run.n
          cc run.c -o haxelib -I/usr/local/include -L"$NEKOPATH" -lneko -Wl,-rpath,"$NEKOPATH"
          sudo ln -s `pwd`/haxelib /usr/local/bin/haxelib

      - name: Print Haxe version
        run: haxe -version

      - name: Setup haxelib
        run: |
          set -ex
          mkdir ~/haxelib
          haxelib setup ~/haxelib

      - name: Install apt packages
        if: matrix.APT_PACKAGES
        run: |
          set -ex
          sudo apt update -qqy
          sudo apt install -qqy ${{matrix.APT_PACKAGES}}

      - name: Flash setup
        if: matrix.target == 'flash'
        run: export DISPLAY=:99.0

      - name: Cache Lua environments
        uses: ./haxe/.github/actions/cache-lua
        if: matrix.target == 'lua'
        with:
          # the action hashes tests/runci/targets/Lua.hx, which is under haxe/ here
          key-prefix: lua-env-linux-${{ matrix.arch }}-${{ hashFiles('haxe/tests/runci/targets/Lua.hx') }}

      - name: Download d8 (Android build-tools)
        if: matrix.target == 'jvm'
        run: |
          set -ex
          curl -fsSLo /tmp/build-tools.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          mkdir -p "$HOME/d8"
          unzip -q /tmp/build-tools.zip -d "$HOME/d8"
          d8=$(find "$HOME/d8" -name d8 -type f -executable | head -n1)
          test -x "$d8"
          echo "D8=$d8" >> "$GITHUB_ENV"

      # not upstream's: core dumps of crashing programs, for the step after Test
      - name: Core dumps
        run: sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/core.%e.%p"

      - name: Test
        run: |
          ulimit -c unlimited
          haxe --run RunCi ${{ matrix.target }} ${{ matrix.runci-args }}
        working-directory: ${{github.workspace}}/haxe/tests
        timeout-minutes: 25

      # not upstream's: where the port crashed (the binary is stripped; the
      # offsets in its mapping symbolize with an unstripped build of the same C)
      - name: Backtraces of core dumps
        if: failure()
        run: |
          ls "$RUNNER_TEMP"/core.haxe.* 2>/dev/null || exit 0
          sudo apt-get install -qqy gdb > /dev/null
          for c in "$RUNNER_TEMP"/core.haxe.*; do
            echo "== $c"
            gdb -batch -ex "info proc mappings" -ex "thread apply all bt 40" -ex "info registers" "$(readlink -f /usr/local/bin/haxe)" "$c" 2>&1 | grep -v "^\[New LWP" | head -400
          done

  mac-test:
    env:
      PLATFORM: mac-universal
      HXCPP_COMPILE_CACHE: ${{ github.workspace }}/hxcache
      HAXE_STD_PATH: ${{ github.workspace }}/haxe/std
    strategy:
      fail-fast: false
      matrix:
        target: [macro, js, hl, cpp, jvm, php, python, lua, flash, neko]
        arch: [arm64]
        include:
        - target: hl
          arch: arm64
          runci-args: --skip-hl-jit
        - target: hl
          arch: x86_64
          runner: macos-15-intel

    runs-on: ${{ matrix.runner || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      # upstream tests a universal binary; the port has one build per architecture
      - uses: actions/download-artifact@v8
        with:
          name: haxe-in-haxe-macos-${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
          path: macBinaries

      - uses: ./haxe/.github/actions/setup-neko

      - name: Setup Haxe
        run: |
          set -ex
          tar -xf macBinaries/*.tar.gz -C macBinaries --strip-components=1
          sudo mkdir -p /usr/local/bin/
          sudo ln -s `pwd`/macBinaries/haxe-in-haxe /usr/local/bin/haxe

      - name: Build haxelib
        working-directory: ${{ github.workspace }}/haxe/extra/haxelib_src
        run: |
          set -ex
          haxe client.hxml
          nekotools boot -c run.n
          cc run.c -o haxelib -I/usr/local/include -L"$NEKOPATH" -lneko -Wl,-rpath,"$NEKOPATH"
          sudo ln -s `pwd`/haxelib /usr/local/bin/haxelib

      - name: Print Haxe version
        run: haxe -version

      - name: Setup haxelib
        run: |
          set -ex
          mkdir ~/haxelib
          haxelib setup ~/haxelib

      - name: Cache Lua environments
        uses: ./haxe/.github/actions/cache-lua
        if: matrix.target == 'lua'
        with:
          key-prefix: lua-env-mac-${{ matrix.arch }}-${{ hashFiles('haxe/tests/runci/targets/Lua.hx') }}

      - name: Test
        run: |
          # disable invalid Unicode filenames on APFS
          echo "" > sys/compile-fs.hxml
          haxe --run RunCi ${{ matrix.target }} ${{ matrix.runci-args }}
        working-directory: ${{github.workspace}}/haxe/tests
        timeout-minutes: 60
