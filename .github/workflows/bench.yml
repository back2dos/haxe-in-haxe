# The HaxeBenchmarks cases on hxmc (native, wasm under node), C++ (hxcpp), the
# JVM, JS on node, HL/C and the HashLink JIT, every Haxe compilation by hxmc or
# the port (hxmc/test/Bench.hx, `make bench`): times, peak RSS, sizes and
# build times, the targets' check outputs compared.
#
# Runs nightly on main (skipped when that commit is already measured) and on
# demand: a dispatch, or a push whose head commit message says [bench] (or
# [bench-publish], which also publishes); other pushes start no job.
# Independent of build.yml, so it never holds up a release or the website.
#
# Sharded by case: `plan` checks whether the commit is measured already and
# splits the cases into groups, one `shard` job (a runner of its own) per
# group, which measures its cases on every target (so a row's targets, and its
# "vs. hxmc", always share one machine; Bench's -c) and uploads its partial
# results; `results` merges them (Bench --merge: the format of an unsharded
# run, with the machine of each case) and publishes. The groups are balanced
# by the cases' measured durations (run 39110201629, seconds with the checks:
# formatter_noio 525, mandelbrot_anon 344, mandelbrot 293, bcrypt 166, alloc
# 124, binarytrees 120, nbody 78, json 61, sha256 40, sha512 28), the longest
# alone: about 12 minutes in all instead of 30. A dispatch whose args name the
# cases (-c) runs them in one shard.
#
# Results: the job summaries and an artifact (bench-results); from main (or
# with publish, or [bench-publish]) appended to the bench-data branch as
# results/<date>-<commit>.json, with history.json and latest.json
# regenerated, which the website's next build copies (build.yml, `make site
# BENCH_DATA=...`).
name: bench

on:
  push:
    branches: ['**']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: runs per case and target
        default: '5'
      args:
        description: more arguments of Bench.hx (e.g. "-c nbody,json -t hxmc,js")
        default: ''
      publish:
        description: append the results to the bench-data branch (always from main)
        type: boolean
        default: false
      force:
        description: measure even when this commit is already on bench-data
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # measured already? the shards (a JSON matrix: index, cases)
  plan:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[bench]') || contains(github.event.head_commit.message, '[bench-publish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.seen.outputs.skip }}
      short: ${{ steps.seen.outputs.short }}
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Measured already?
        id: seen
        run: |
          set -ex
          short=$(git rev-parse --short=7 HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          mkdir -p bin/bench-data
          if git fetch --depth 1 origin bench-data; then git archive FETCH_HEAD | tar -x -C bin/bench-data; fi
          if [ "${{ inputs.force }}" != true ] && [ "${{ github.event_name }}" = schedule ] && ls bin/bench-data/results/*-$short.json 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # the groups, balanced by duration (see above); a case of Bench's not in
      # any group gets a shard of its own; args with -c: one shard, Bench's -c
      - name: Shards
        id: shards
        env:
          ARGS: ${{ inputs.args }}
        run: |
          set -e
          if printf ' %s ' "$ARGS" | grep -qE '[[:space:]]-c[[:space:]]'; then
            groups=("")
          else
            groups=("formatter_noio" "mandelbrot_anon,json,sha512" "mandelbrot,binarytrees" "bcrypt,alloc,nbody,sha256")
            for c in $(grep -oE '\{name: "[a-z0-9_]+", dir: ' hxmc/test/Bench.hx | cut -d'"' -f2); do
              case ",$(IFS=,; echo "${groups[*]}")," in *",$c,"*) ;; *) echo "::warning::case $c is in no group: a shard of its own"; groups+=("$c") ;; esac
            done
          fi
          matrix=$(for i in "${!groups[@]}"; do printf '{"index":%d,"cases":"%s"}\n' "$i" "${groups[$i]}"; done | jq -cs '{include: .}')
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

  # the cases of one group, every target, on this runner
  shard:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    name: shard ${{ matrix.index }} (${{ matrix.cases || 'args' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: System packages
        run: sudo apt-get install -qqy time
      # the published runtime objects of this hxmc/deps, else built with zig
      - name: Runtime objects
        id: rt
        run: |
          echo "zig=$(cat hxmc/deps/zig-version)" >> "$GITHUB_OUTPUT"
          if node hxmc/bootstrap/rt.mjs fetch bin/hxmc/rt; then echo "hit=true" >> "$GITHUB_OUTPUT"; else echo "hit=false" >> "$GITHUB_OUTPUT"; fi
      - uses: mlugg/setup-zig@v2
        if: steps.rt.outputs.hit != 'true'
        with:
          version: ${{ steps.rt.outputs.zig }}
      - name: Runtime objects with zig
        if: steps.rt.outputs.hit != 'true'
        run: sudo apt-get install -qqy lld && make rt-build
      # (built here, in parallel on every shard: a job building them once
      # would put its own start, the upload and the downloads on the way)
      - name: The tool, the port and lix
        run: |
          set -ex
          touch bin/hxmc/rt/*/*.o
          make hxmc port lix
      # the key: the pinned versions only (the runner and the cases' libraries,
      # HashLink, the lix libraries: Bench.hx's lines with a commit or the
      # HashLink tag), and the targets when args choose them (a scope set up
      # for some targets only lacks the others' tools)
      - name: Toolchain pins
        id: pins
        env:
          ARGS: ${{ inputs.args }}
        run: |
          pins=$(grep -E 'commit: "|HASHLINK = \{' hxmc/test/Bench.hx | tr -d '[:space:]' | sha256sum | cut -c1-16)
          targets=$(printf ' %s ' "$ARGS" | grep -oE '[[:space:]]-t[[:space:]]+[^[:space:]]+' | awk '{print $2}' | tr ',' '-' || true)
          echo "key=bench-tools-${{ runner.os }}-$pins-${targets:-all}" | tee -a "$GITHUB_OUTPUT"
      # the runner, the cases' libraries, HashLink (built), the lix scope (hxcpp, hxnodejs, hxjava)
      - name: Cache the benchmark toolchains
        uses: actions/cache@v6
        with:
          path: |
            bin/bench/runner
            bin/bench/libs
            bin/bench/hashlink-*
            bin/bench/scope
          key: ${{ steps.pins.outputs.key }}
      - name: Benchmarks
        env:
          ARGS: ${{ inputs.args }}
          CASES: ${{ matrix.cases }}
        run: |
          set -ex
          ulimit -s unlimited
          make bench BENCH_ARGS="-n ${{ inputs.runs || '5' }} --out bin/bench/results-${{ matrix.index }}.json $ARGS ${CASES:+-c $CASES}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-part-${{ matrix.index }}
          path: bin/bench/results-${{ matrix.index }}.json
          if-no-files-found: ignore
          retention-days: 7
      # the tool, for the results job's Bench --merge and --history
      - uses: actions/upload-artifact@v7
        if: matrix.index == 0
        with:
          name: bench-tool
          path: bin/hxmc/hxmc
          retention-days: 1

  # the shards' results as one, published
  results:
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' && needs.shard.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' || inputs.publish == true || contains(github.event.head_commit.message, '[bench-publish]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-part-*
          path: bin/bench/parts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: bench-tool
          path: bin/hxmc
      - name: Merge
        run: |
          set -ex
          chmod +x bin/hxmc/hxmc
          ls -l bin/bench/parts
          bin/hxmc/hxmc -cp hxmc/test -cp haxe/test --run Bench --merge bin/bench/results.json bin/bench/parts/*.json
      - uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bin/bench/results.json
          retention-days: 30
      # results/<date>-<commit>.json, history.json, latest.json on bench-data
      # (an orphan branch: data only), retried when another run pushed first;
      # only when every shard succeeded
      - name: Publish to bench-data
        if: env.PUBLISH == 'true' && needs.shard.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -ex
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          name="$(date -u +%Y-%m-%d)-${{ needs.plan.outputs.short }}.json"
          for attempt in 1 2 3 4 5; do
            rm -rf bin/bench-data && mkdir -p bin/bench-data && cd bin/bench-data && git init -q
            git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
            if git fetch -q origin bench-data; then git checkout -q -b bench-data FETCH_HEAD; else git checkout -q --orphan bench-data; fi
            mkdir -p results && cp ../bench/results.json "results/$name"
            cd ../.. && bin/hxmc/hxmc -cp hxmc/test -cp haxe/test --run Bench --history bin/bench-data && cd bin/bench-data
            git add -A && git commit -q -m "Benchmarks at ${{ needs.plan.outputs.short }} ($GITHUB_REF_NAME, run $GITHUB_RUN_ID)"
            if git push -q origin bench-data; then exit 0; fi
            cd ../.. && sleep $((attempt * 5))
          done
          exit 1
