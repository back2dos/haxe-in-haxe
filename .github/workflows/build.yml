# Builds everything with hxmc (hxmc/README.md) on Linux and tests it on a
# machine of each target:
#
# - build: the reference compiler (cached), hxmc bootstrapped from it (the
#   reference writes the tool as JavaScript, node compiles the tool's HXB,
#   the tool rebuilds itself; the fixpoint is checked), the runtime objects of
#   the six targets with mbedtls and libuv (hxmc/tools/deps.sh, cached), then
#   with hxmc: the port's release binaries for the six targets (`make
#   release`), lix for the six targets (`make lix-release`), the playground's
#   WebAssembly and the website (`make site`), hxmc's test corpus for every
#   target and as WebAssembly, the same programs and the tool built by the
#   tool as a WebAssembly module (byte-identical: hxmc/tools/crosshost.py),
#   and the port as a WebAssembly module.
# - test: on each target's machine, the release binary's smoke test
#   (tools/smoke.sh: --interp, HXB, JS, a TLS handshake with the system's CA
#   certificates, libuv), lix (lix shims, a scope, an install, the haxe shim),
#   hxmc's corpus against its golden files and the port's self-compile to the
#   reference's HXB.
# - wasm: the corpus and the port's self-compile under node and wasmtime, and
#   the playground in Chromium, Firefox and WebKit (site/tools/browser-test.mjs).
# - upstream-tests: upstream Haxe's CI suite with the release binaries as haxe
#   (upstream-tests.yml).
# - release: a rolling `nightly` pre-release on pushes to main, a release on
#   v* tags; pages: the website on pushes to main.
#
# Release assets (https://github.com/<repo>/releases/download/<tag>/<asset>),
# each with the std, LICENSE, COPYING, LICENSE.mbedtls and LICENSE.libuv:
#   haxe-in-haxe-linux-x86_64.tar.gz   haxe-in-haxe-linux-aarch64.tar.gz
#   haxe-in-haxe-macos-x86_64.tar.gz   haxe-in-haxe-macos-aarch64.tar.gz
#   haxe-in-haxe-windows-x86_64.zip    haxe-in-haxe-windows-aarch64.zip (haxe-in-haxe.exe)
name: build

on:
  push:
    branches: [main, hxmc]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  OCAML_VERSION: 5.3.0
  ZIG_VERSION: 0.17.0
  HXNODEJS_COMMIT: 8aff897563076d607e6a4d0d6287adb7724c6273
  WASMTIME_VERSION: 38.0.1
  # the directory the port's self-compile runs in, on Linux (the reference)
  # and on macOS: the archive names files by absolute path
  SELF_ROOT: /Users/runner/hih
  TARGETS: linux-x86_64 linux-arm64 windows-x86_64 windows-arm64 macos-x86_64 macos-arm64

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OPAMYES: 1
      PLATFORM: linux64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Reference compiler revision
        id: ref
        run: echo "rev=$(git -C haxe rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the reference compiler
        id: cache-haxe
        uses: actions/cache@v6
        with:
          path: haxe/haxe
          key: haxe-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ steps.ref.outputs.rev }}

      - name: System packages
        run: |
          sudo apt-get update -qqy
          # (the reference links mbedtls and pcre2 dynamically; ld.lld: hxmc/tools/mkrt.sh)
          sudo apt-get install -qqy lld libpcre2-dev zlib1g-dev libmbedtls-dev
          if [ "${{ steps.cache-haxe.outputs.cache-hit }}" != true ]; then sudo apt-get install -qqy opam ninja-build; fi

      - name: Cache opam
        if: steps.cache-haxe.outputs.cache-hit != 'true'
        id: cache-opam
        uses: actions/cache@v6
        with:
          path: ~/.opam/
          key: opam-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ hashFiles('haxe/haxe.opam') }}

      - name: Neko (for the opam package conf-neko)
        if: steps.cache-haxe.outputs.cache-hit != 'true' && steps.cache-opam.outputs.cache-hit != 'true'
        uses: ./haxe/.github/actions/setup-neko

      - name: OCaml libraries
        if: steps.cache-haxe.outputs.cache-hit != 'true' && steps.cache-opam.outputs.cache-hit != 'true'
        run: |
          set -ex
          opam init -c "$OCAML_VERSION" --disable-sandboxing
          opam pin add haxe ./haxe --no-action
          opam install haxe --deps-only --assume-depexts

      - name: Build the reference compiler
        if: steps.cache-haxe.outputs.cache-hit != 'true'
        run: |
          set -ex
          eval $(opam env)
          make -C haxe -s -j"$(nproc)" haxe

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache mbedtls and libuv
        uses: actions/cache@v6
        with:
          path: bin/hxmc/deps
          key: hxmc-deps-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('hxmc/tools/deps.sh') }}

      # the tool from scratch (hxmc/README.md, "Bootstrap"): the reference
      # compiler writes the tool's JavaScript and HXB, node compiles the HXB
      # to the first native tool, which builds the tool from source
      - name: Bootstrap hxmc
        run: |
          set -ex
          git init -q "$RUNNER_TEMP/hxnodejs"
          git -C "$RUNNER_TEMP/hxnodejs" fetch -q --depth 1 https://github.com/HaxeFoundation/hxnodejs "$HXNODEJS_COMMIT"
          git -C "$RUNNER_TEMP/hxnodejs" checkout -q FETCH_HEAD
          make bootstrap TOOL_LIBS="$RUNNER_TEMP/hxnodejs/extraParams.hxml -cp $RUNNER_TEMP/hxnodejs/src"
          tail -4 bin/hxmc/boot/hxmc1.log

      - name: The tool rebuilt by itself does not change
        run: make fixpoint

      - name: Runtime objects (with mbedtls and libuv)
        run: make rt RT_TARGETS="$TARGETS"

      - name: The port's release binaries
        run: |
          set -ex
          for t in $TARGETS; do make release TARGET=$t; done
          ls -l bin/release/*

      - name: lix
        run: |
          set -ex
          mkdir -p dist/lix
          for t in $TARGETS; do
            make lix-release TARGET=$t
            case $t in windows-*) cp bin/release/$t/lix.exe dist/lix/lix-$t.exe ;; *) cp bin/release/$t/lix dist/lix/lix-$t ;; esac
          done
          ls -l dist/lix

      - name: Package the release binaries
        run: |
          set -ex
          for t in $TARGETS; do
            os=${t%-*}
            case $t in *-arm64) arch=aarch64 ;; *) arch=x86_64 ;; esac
            P=haxe-in-haxe-$os-$arch
            exe=; [ $os = windows ] && exe=.exe
            mkdir -p "pkg/$P"
            cp bin/release/$t/haxe-in-haxe$exe LICENSE COPYING bin/hxmc/deps/$t/LICENSE.mbedtls bin/hxmc/deps/$t/LICENSE.libuv "pkg/$P/"
            cp -r haxe/std "pkg/$P/std"
            if [ $os = windows ]; then
              printf '%s\r\n' \
                "haxe-in-haxe: the Haxe compiler ported to Haxe, built by hxmc (https://github.com/$GITHUB_REPOSITORY)." \
                "Commit $GITHUB_SHA, target $t (with mbedtls and libuv)." "" \
                "Use it like haxe.exe, with HAXE_STD_PATH pointing at the std directory next to it:" \
                "  set HAXE_STD_PATH=%CD%\\std" \
                "  haxe-in-haxe.exe -main Main --interp" > "pkg/$P/README.txt"
              (cd pkg && zip -qr -9 "../dist/$P.zip" "$P")
            else
              printf '%s\n' \
                "haxe-in-haxe: the Haxe compiler ported to Haxe, built by hxmc (https://github.com/$GITHUB_REPOSITORY)." \
                "Commit $GITHUB_SHA, target $t (with mbedtls and libuv)." "" \
                "Use it like haxe, with HAXE_STD_PATH pointing at the std directory next to it:" \
                "  export HAXE_STD_PATH=\$PWD/std" \
                "  ./haxe-in-haxe -main Main --interp" \
                "macOS: a browser download is quarantined; xattr -d com.apple.quarantine haxe-in-haxe" > "pkg/$P/README.txt"
              tar czf "dist/$P.tar.gz" -C pkg "$P"
            fi
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with: {name: haxe-in-haxe-linux-x86_64, path: dist/haxe-in-haxe-linux-x86_64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: haxe-in-haxe-linux-aarch64, path: dist/haxe-in-haxe-linux-aarch64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: haxe-in-haxe-macos-x86_64, path: dist/haxe-in-haxe-macos-x86_64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: haxe-in-haxe-macos-aarch64, path: dist/haxe-in-haxe-macos-aarch64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: haxe-in-haxe-windows-x86_64, path: dist/haxe-in-haxe-windows-x86_64.zip, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: haxe-in-haxe-windows-aarch64, path: dist/haxe-in-haxe-windows-aarch64.zip, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: lix, path: dist/lix/, retention-days: 14}

      # the website: the playground's WebAssembly, the pages' JavaScript
      # compiled by the Linux release binary, lix under tools/
      - name: The website
        run: |
          set -ex
          make site SITE_HAXE="$PWD/bin/release/linux-x86_64/haxe-in-haxe" LIX_DIR=dist/lix
          ls -l bin/site bin/site/tools
      - uses: actions/upload-artifact@v7
        with: {name: site, path: bin/site/, retention-days: 7}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: bin/site

      - name: Cross-build hxmc's corpus
        run: |
          set -ex
          for t in $TARGETS wasm32-wasi; do
            python3 hxmc/tools/run.py -v --target $t --stage dist/corpus/$t
          done

      # hxmc's output does not depend on the host: the tool as a WebAssembly
      # module (under node) builds the corpus for every target, and the tool
      # itself, byte-identical to the native tool
      - name: hxmc as a WebAssembly module, byte-identical output
        run: python3 hxmc/tools/crosshost.py --tool

      - name: The port as a WebAssembly module
        run: |
          set -ex
          mkdir -p dist/wasm
          HXMC_STATS=1 bin/hxmc/hxmc dist/wasm/haxe.wasm -cp src -main haxe.Main -D disable-parallelism -cp bin/hxmc/std --custom-target hxmc -D hxmc.target=wasm32-wasi | tail -3
          ls -l dist/wasm/haxe.wasm

      # the reference's self-compile, in the directory the macOS runners use
      - name: Reference self-compile
        run: |
          set -ex
          sudo mkdir -p "$SELF_ROOT" && sudo chown "$USER" "$SELF_ROOT"
          cp -r src "$SELF_ROOT/src"
          cp -r haxe/std "$SELF_ROOT/std"
          (cd "$SELF_ROOT" && HAXE_STD_PATH=std "$GITHUB_WORKSPACE/haxe/haxe" -cp src -main haxe.Main -D disable-parallelism --interp --no-output --hxb self-ref.hxb)
          mkdir -p dist/self
          cp "$SELF_ROOT/self-ref.hxb" dist/self/
          # the sources as compiled here (a Windows checkout would have CRLF
          # line ends, and other positions)
          tar czf dist/self/std.tar.gz -C haxe std
          tar czf dist/self/src.tar.gz src

      - name: Pack the corpus
        run: |
          for t in $TARGETS wasm32-wasi; do tar czf dist/corpus-$t.tar.gz -C dist/corpus/$t .; done
          tar czf dist/corpus-wasm32-wasi-port.tar.gz -C dist/wasm haxe.wasm
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-self, path: dist/self/, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-linux-x86_64, path: dist/corpus-linux-x86_64.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-linux-arm64, path: dist/corpus-linux-arm64.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-windows-x86_64, path: dist/corpus-windows-x86_64.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-windows-arm64, path: dist/corpus-windows-arm64.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-macos-x86_64, path: dist/corpus-macos-x86_64.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-macos-arm64, path: dist/corpus-macos-arm64.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-wasm32-wasi, path: "dist/corpus-wasm32-wasi*.tar.gz", retention-days: 3}

  # on a machine of each target: the release binary, lix, hxmc's corpus and
  # the port's self-compile
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64, pkg: linux-x86_64, os: ubuntu-24.04}
          - {target: linux-arm64, pkg: linux-aarch64, os: ubuntu-24.04-arm}
          - {target: windows-x86_64, pkg: windows-x86_64, os: windows-2025}
          - {target: windows-arm64, pkg: windows-aarch64, os: windows-11-arm}
          - {target: macos-x86_64, pkg: macos-x86_64, os: macos-15-intel}
          - {target: macos-arm64, pkg: macos-aarch64, os: macos-15}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            hxmc/tools
            tools
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with: {name: 'haxe-in-haxe-${{ matrix.pkg }}', path: dl}
      - uses: actions/download-artifact@v8
        with: {name: 'corpus-${{ matrix.target }}', path: dl}
      - uses: actions/download-artifact@v8
        with: {name: hxmc-self, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: lix, path: lix}
      - name: Unpack
        id: unpack
        run: |
          set -ex
          mkdir -p t corpus std-x
          case "${{ matrix.target }}" in
            windows-*)
              unzip -q dl/haxe-in-haxe-${{ matrix.pkg }}.zip -d t
              echo "bin=$PWD/t/haxe-in-haxe-${{ matrix.pkg }}/haxe-in-haxe.exe" >> "$GITHUB_OUTPUT"
              # a Windows path (C:/...) for the native program
              echo "std=$(cygpath -m "$PWD/t/haxe-in-haxe-${{ matrix.pkg }}/std")" >> "$GITHUB_OUTPUT" ;;
            *)
              tar xzf dl/haxe-in-haxe-${{ matrix.pkg }}.tar.gz -C t
              echo "bin=$PWD/t/haxe-in-haxe-${{ matrix.pkg }}/haxe-in-haxe" >> "$GITHUB_OUTPUT"
              echo "std=$PWD/t/haxe-in-haxe-${{ matrix.pkg }}/std" >> "$GITHUB_OUTPUT" ;;
          esac
          tar xzf dl/corpus-${{ matrix.target }}.tar.gz -C corpus
          tar xzf dl/std.tar.gz -C std-x
          tar xzf dl/src.tar.gz -C std-x
          ls -l t/*
      - name: Smoke test
        run: |
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          SMOKE_DIR="$RUNNER_TEMP/smoke" sh tools/smoke.sh "${{ steps.unpack.outputs.bin }}"
      - name: Smoke test (PowerShell, Windows paths)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HAXE_STD_PATH = (Resolve-Path "t/haxe-in-haxe-${{ matrix.pkg }}/std").Path
          $exe = (Resolve-Path "t/haxe-in-haxe-${{ matrix.pkg }}/haxe-in-haxe.exe").Path
          New-Item -ItemType Directory -Force ps | Out-Null
          Set-Location ps
          Set-Content Main.hx 'class Main { static function main() { trace("hello from " + #if sys Sys.systemName() + " in " + Sys.getCwd() #else "js" #end); } }'
          $out = & $exe -main Main --interp
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out
          # the native build's Eval host: Windows, with a drive letter
          if (-not ($out -match "hello from Windows in [A-Z]:\\")) { exit 1 }
          & $exe -main Main --js out.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node out.js
          & $exe -cp . -main Main --hxb out.hxb
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item out.hxb
      - name: lix
        run: |
          set -ex
          # installed as the site says: the platform's binary as lix, then lix shims
          # (a POSIX path for bash: on Windows, MSYS converts PATH for native programs)
          B="$RUNNER_TEMP/lix-bin"
          if [ "$RUNNER_OS" = Windows ]; then B=$(cygpath -u "$B"); fi
          mkdir -p "$B"
          if [ "$RUNNER_OS" = Windows ]; then
            cp lix/lix-${{ matrix.target }}.exe "$B/lix.exe"; L="$B/lix.exe"; H="$B/haxe.exe"
          else
            cp lix/lix-${{ matrix.target }} "$B/lix"; chmod +x "$B/lix"; L="$B/lix"; H="$B/haxe"
          fi
          "$L" --version
          "$L" shims
          ls -l "$B"
          # the commands on PATH (the libraries' install commands call lix)
          export PATH="$B:$PATH"
          export HAXESHIM_ROOT="$RUNNER_TEMP/lix-root"
          mkdir -p "$RUNNER_TEMP/lix-project/src" && cd "$RUNNER_TEMP/lix-project"
          "$L" scope create
          # Haxe and neko have no Windows ARM64 builds, and lix (as upstream's)
          # maps no platform there ("Unsupported platform: unknown"): no downloads
          if [ "${{ matrix.target }}" = windows-arm64 ]; then exit 0; fi
          "$L" download
          "$L" install haxelib:tink_core
          cat haxe_libraries/tink_core.hxml .haxerc
          # a fresh clone's case: the libraries reinstalled from haxe_libraries
          "$L" install haxelib:tink_json
          rm -rf "$HAXESHIM_ROOT/haxe_libraries"
          "$L" download
          echo 'class Main { static function main() trace(tink.core.Outcome.Success(#if sys Sys.args() #else "js" #end)); }' > src/Main.hx
          # Haxe 4.3.7 has no Linux ARM64 build: lix (as the npm package)
          # downloads the x86-64 one there, which does not run
          if [ "${{ matrix.target }}" = linux-arm64 ]; then "$H" --run resolve-args -lib tink_json; exit 0; fi
          "$H" -version
          "$H" --run resolve-args -lib tink_core
          "$H" --run resolve-args -lib tink_json
          "$H" -cp src -lib tink_core --run Main a b
          "$H" -cp src -lib tink_core -main Main --js main.js && node main.js
      - name: Corpus
        if: always()
        run: python hxmc/tools/check.py corpus --summary "$GITHUB_STEP_SUMMARY"
      # the free nursery filled with a pattern: allocations that are not
      # initialized and references a collection missed read it at once
      - name: Corpus, RT_VERIFY=1
        if: always()
        run: RT_VERIFY=1 python hxmc/tools/check.py corpus --summary "$GITHUB_STEP_SUMMARY"
      - name: Port self-compile
        if: always()
        run: |
          set -ex
          root="$SELF_ROOT"
          exe=t/haxe-in-haxe-${{ matrix.pkg }}/haxe-in-haxe
          if [ "$RUNNER_OS" = Windows ]; then exe=$exe.exe; fi
          if [ "$RUNNER_OS" = Linux ]; then sudo mkdir -p "$root" && sudo chown "$USER" "$root"; fi
          if [ "$RUNNER_OS" = Windows ]; then root="$(cygpath -w "$RUNNER_TEMP")\\hih"; fi
          # (MSYS would rewrite the reference's root, a POSIX path)
          MSYS_NO_PATHCONV=1 python hxmc/tools/selfcheck.py --port "$exe" --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$root" --summary "$GITHUB_STEP_SUMMARY"

  # the WebAssembly corpus (hxmc/README.md, "WebAssembly") under node 22 and
  # wasmtime, the port as a module compiling itself under both, and the
  # playground in the three browser engines
  wasm:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            hxmc/tools
            site/tools
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: wasmtime
        run: |
          set -ex
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/v$WASMTIME_VERSION/wasmtime-v$WASMTIME_VERSION-x86_64-linux.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v$WASMTIME_VERSION-x86_64-linux" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with: {name: corpus-wasm32-wasi, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: hxmc-self, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: site, path: site-dist}
      - name: Unpack
        run: |
          set -ex
          mkdir -p corpus port std-x
          tar xzf dl/corpus-wasm32-wasi.tar.gz -C corpus
          tar xzf dl/corpus-wasm32-wasi-port.tar.gz -C port
          tar xzf dl/std.tar.gz -C std-x
          tar xzf dl/src.tar.gz -C std-x
          sudo mkdir -p "$SELF_ROOT" && sudo chown "$USER" "$SELF_ROOT"
      # (node 22: exception handling with exnref is behind a flag; no fast
      # API calls: hxmc/tools/run.py)
      - name: Corpus under node
        if: always()
        run: python3 hxmc/tools/check.py corpus --runner "node --experimental-wasm-exnref --no-turbo-fast-api-calls --no-warnings $PWD/hxmc/tools/wasi.mjs" --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus under node, RT_VERIFY=1
        if: always()
        run: RT_VERIFY=1 python3 hxmc/tools/check.py corpus --runner "node --experimental-wasm-exnref --no-turbo-fast-api-calls --no-warnings $PWD/hxmc/tools/wasi.mjs" --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus under wasmtime
        if: always()
        run: python3 hxmc/tools/check.py corpus --runner "wasmtime run -W exceptions=y --dir . --dir / --env RT_MINOR_KB" --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus under wasmtime, 16 KB nursery
        if: always()
        run: RT_MINOR_KB=16 python3 hxmc/tools/check.py corpus --runner "wasmtime run -W exceptions=y --dir . --dir / --env RT_MINOR_KB" --summary "$GITHUB_STEP_SUMMARY"
      # the port as a module compiles its own source to the reference's HXB
      - name: Port self-compile under node
        if: always()
        run: python3 hxmc/tools/selfcheck.py --runner "node --experimental-wasm-exnref --no-turbo-fast-api-calls --no-warnings --stack-size=8000 $PWD/hxmc/tools/wasi.mjs" --port port/haxe.wasm --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$SELF_ROOT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Port self-compile under wasmtime
        if: always()
        run: python3 hxmc/tools/selfcheck.py --runner "wasmtime run -W exceptions=y -W max-wasm-stack=67108864 --dir / --env HAXE_STD_PATH --env PWD" --port port/haxe.wasm --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$SELF_ROOT" --summary "$GITHUB_STEP_SUMMARY"
      # the playground's worker (site/src/Worker.hx, WasiHost.hx) in the
      # browsers' engines: --interp, HXB, diagnostics and completion
      - name: Playground in Chromium, Firefox and WebKit
        if: always()
        run: |
          set -ex
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit > /dev/null
          node site/tools/browser-test.mjs site-dist chromium firefox webkit

  # upstream Haxe's CI test suite (RunCi for every target) with the release
  # binaries as haxe (upstream-tests.yml)
  upstream-tests:
    needs: build
    uses: ./.github/workflows/upstream-tests.yml

  # nightly on main, a release on v* tags
  release:
    needs: [test, wasm]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: haxe-in-haxe-*
          path: assets
          merge-multiple: true
      - name: Publish
        run: |
          set -ex
          ls -l assets
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-9)
          NOTES="Built from $GITHUB_SHA by hxmc (the port compiled to machine code for each target, cross-built on Linux, with mbedtls and libuv).

          - haxe-in-haxe-<os>-<arch>.tar.gz: Linux and macOS, with std/; set HAXE_STD_PATH to it.
          - haxe-in-haxe-windows-<arch>.zip: Windows, haxe-in-haxe.exe, with std/; set HAXE_STD_PATH to it.

          Each archive carries the licenses: LICENSE and COPYING (the port), LICENSE.mbedtls and LICENSE.libuv."
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
            gh release create "$TAG" --verify-tag --title "haxe-in-haxe $TAG" --notes "$NOTES" assets/*
          else
            TAG=nightly
            if gh release view "$TAG" > /dev/null 2>&1; then
              # move the tag, then replace the assets in place (the download URLs stay valid)
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
              gh release upload "$TAG" assets/* --clobber
              # assets of earlier builds that are not built any more
              for a in haxe-in-haxe.com haxe-in-haxe-licenses.zip; do gh release delete-asset "$TAG" "$a" -y || true; done
              gh release edit "$TAG" --prerelease --title "Nightly ($SHORT)" --notes "$NOTES"
            else
              gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Nightly ($SHORT)" --notes "$NOTES" assets/*
            fi
          fi

  pages:
    needs: [build, wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
