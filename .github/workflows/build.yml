# Builds everything from source with node and hxmc (README.md, "Building")
# and tests it on a machine of each target:
#
# - rt: the runtime objects of the six targets (hxmc/deps with mbedtls and libuv,
#   built by zig) are the release rt-<hash of hxmc/deps>
#   (hxmc/bootstrap/rt.mjs); built here only when that release is missing
#   (and published from pushes to main and hxmc), passed on as an artifact.
# - build: the committed stage0 module under node builds the tool, which
#   rebuilds itself (the fixpoint), and its types cache is checked; then with
#   the tool: the port's release binaries and lix for the six targets, the
#   npm packages (with the compiler as a WebAssembly module), the website,
#   hxmc's corpus for every target; the tool as a WebAssembly module building
#   the corpus and itself byte-identical (crosshost); lix downloads the
#   reference compiler (the nightly of the pinned upstream commit, cached);
#   peak memory and times (haxe/test/Measure.hx) go to the job summary.
# - conformance: the port against the reference: HXB of the upstream suites
#   and macro cases, display requests, the compilation server and its
#   JSON-RPC methods, upstream's target suites compiled by both and compared
#   file by file (haxe/test).
# - test: on each target's machine, the release binary's smoke test (with a
#   TLS handshake and libuv), lix, hxmc's corpus and the port's self-compile.
# - wasm: the corpus and the port's self-compile under node and wasmtime, the
#   playground in Chromium, Firefox and WebKit.
# - npm: the nine packages (@hxmc/cli, its six platform packages, @hxmc/wasm,
#   @hxmc/source) installed in fresh projects on each target's machine: native
#   at once, -lib from node_modules, --ignore-scripts, lix, the WebAssembly fallback (downloaded,
#   installed) and hxmc-rebuild; publish-npm publishes them on v* tags and
#   (as nightlies) from main.
# - upstream-tests: upstream's compiler-side suite (RunCi macro) with the
#   release binaries as haxe (upstream-tests.yml).
# - release: a rolling `nightly` pre-release on pushes to main, a release on
#   v* tags; pages: the website on pushes to main (with the benchmark history
#   of the bench-data branch, which bench.yml writes).
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  WASMTIME_VERSION: 38.0.1
  # the directory the port's self-compile runs in, on Linux (the reference)
  # and on macOS: the archive names files by absolute path
  SELF_ROOT: /Users/runner/hih
  TARGETS: linux-x86_64 linux-arm64 windows-x86_64 windows-arm64 macos-x86_64 macos-arm64

jobs:
  rt:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The published runtime objects
        id: rt
        run: |
          set -ex
          echo "hash=$(node hxmc/bootstrap/rt.mjs hash)" >> "$GITHUB_OUTPUT"
          echo "zig=$(cat hxmc/deps/zig-version)" >> "$GITHUB_OUTPUT"
          if node hxmc/bootstrap/rt.mjs fetch bin/hxmc/rt; then echo "hit=true" >> "$GITHUB_OUTPUT"; else echo "hit=false" >> "$GITHUB_OUTPUT"; fi
      - uses: mlugg/setup-zig@v2
        if: steps.rt.outputs.hit != 'true'
        with:
          version: ${{ steps.rt.outputs.zig }}
      - name: System packages
        if: steps.rt.outputs.hit != 'true'
        run: sudo apt-get install -qqy lld llvm
      - name: Cache mbedtls and libuv
        if: steps.rt.outputs.hit != 'true'
        uses: actions/cache@v6
        with:
          path: bin/hxmc/deps
          key: hxmc-deps-zig-${{ steps.rt.outputs.zig }}-${{ hashFiles('hxmc/deps/deps.sh') }}
      # the tool comes from the stage0 module (the Windows and macOS objects are
      # assembled by it)
      - name: Build the runtime objects with zig
        if: steps.rt.outputs.hit != 'true'
        run: make rt-build
      - name: Publish rt-${{ steps.rt.outputs.hash }}
        if: steps.rt.outputs.hit != 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hxmc')
        run: |
          set -ex
          node hxmc/bootstrap/rt.mjs pack bin/hxmc/rt dist/rt
          gh release create "rt-${{ steps.rt.outputs.hash }}" --target "$GITHUB_SHA" --prerelease \
            --title "hxmc runtime objects ${{ steps.rt.outputs.hash }}" \
            --notes "hxmc's runtime objects (rt.o, ssl.o, uv.o) for the six targets and the glibc mode of Linux, built by zig ${{ steps.rt.outputs.zig }} from hxmc/deps at $GITHUB_SHA; downloaded by hxmc/bootstrap/rt.mjs." dist/rt/*
      - uses: actions/upload-artifact@v7
        with:
          name: rt
          path: |
            bin/hxmc/rt/HASH
            bin/hxmc/rt/LICENSE.*
            bin/hxmc/rt/*/*.o
          retention-days: 7

  build:
    needs: rt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # (zig: the C companions of corpus cases, Corpus.nativeInputs)
      - id: zig
        run: echo "version=$(cat hxmc/deps/zig-version)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
      - uses: actions/download-artifact@v8
        with: {name: rt, path: bin/hxmc/rt}
      - name: System packages
        run: sudo apt-get install -qqy time
      - name: Runtime objects in place
        run: touch bin/hxmc/rt/*/*.o && ls -l bin/hxmc/rt/*

      # the tool from the committed stage0 (README.md, "Building"): node runs
      # it to build the first native tool, which builds the tool from source;
      # the tool rebuilt by itself does not change
      - name: Bootstrap from the stage0
        run: |
          set -ex
          s=$(date +%s)
          make bootstrap
          echo "BOOTSTRAP_SECONDS=$(( $(date +%s) - s ))" >> "$GITHUB_ENV"
      # the cache of the runtime's typed modules (hxmc/src/hxmc/TypesCache.hx)
      - name: Types cache
        run: bin/hxmc/hxmc -cp hxmc/test -cp haxe/test --run CacheCheck

      - name: lix
        run: make lix

      - name: Reference compiler revision
        id: ref
        run: echo "rev=$(git rev-parse --short=7 HEAD:haxe/upstream)" >> "$GITHUB_OUTPUT"
      - name: Cache the reference compiler
        uses: actions/cache@v6
        with:
          path: bin/reference
          key: reference-nightly-${{ steps.ref.outputs.rev }}
      - name: The reference compiler (lix downloads the nightly)
        run: make reference && bin/reference/haxe -version

      - name: The port's release binaries
        run: |
          set -ex
          for t in $TARGETS; do make release TARGET=$t; done
          ls -l bin/release/*

      - name: lix for the six targets
        run: |
          set -ex
          mkdir -p dist/lix
          for t in $TARGETS; do
            make lix-release TARGET=$t
            case $t in windows-*) cp bin/release/$t/lix.exe dist/lix/lix-$t.exe ;; *) cp bin/release/$t/lix dist/lix/lix-$t ;; esac
          done
          ls -l dist/lix

      - name: Package the release binaries
        run: |
          set -ex
          for t in $TARGETS; do
            os=${t%-*}
            case $t in *-arm64) arch=aarch64 ;; *) arch=x86_64 ;; esac
            P=hxmc-haxe-$os-$arch
            exe=; [ $os = windows ] && exe=.exe
            mkdir -p "pkg/$P"
            cp bin/release/$t/haxe$exe LICENSE COPYING bin/hxmc/rt/LICENSE.mbedtls bin/hxmc/rt/LICENSE.libuv "pkg/$P/"
            cp -r haxe/upstream/std "pkg/$P/std"
            if [ $os = windows ]; then
              printf '%s\r\n' \
                "haxe: the Haxe compiler ported to Haxe, built by hxmc (https://github.com/$GITHUB_REPOSITORY)." \
                "Commit $GITHUB_SHA, target $t (with mbedtls and libuv)." "" \
                "Use it like haxe.exe, with HAXE_STD_PATH pointing at the std directory next to it:" \
                "  set HAXE_STD_PATH=%CD%\\std" \
                "  haxe.exe -main Main --interp" > "pkg/$P/README.txt"
              (cd pkg && zip -qr -9 "../dist/$P.zip" "$P")
            else
              printf '%s\n' \
                "haxe: the Haxe compiler ported to Haxe, built by hxmc (https://github.com/$GITHUB_REPOSITORY)." \
                "Commit $GITHUB_SHA, target $t (with mbedtls and libuv)." "" \
                "Use it like haxe, with HAXE_STD_PATH pointing at the std directory next to it:" \
                "  export HAXE_STD_PATH=\$PWD/std" \
                "  ./haxe -main Main --interp" \
                "macOS: a browser download is quarantined; xattr -d com.apple.quarantine haxe" > "pkg/$P/README.txt"
              tar czf "dist/$P.tar.gz" -C pkg "$P"
            fi
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-linux-x86_64, path: dist/hxmc-haxe-linux-x86_64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-linux-aarch64, path: dist/hxmc-haxe-linux-aarch64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-macos-x86_64, path: dist/hxmc-haxe-macos-x86_64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-macos-aarch64, path: dist/hxmc-haxe-macos-aarch64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-windows-x86_64, path: dist/hxmc-haxe-windows-x86_64.zip, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-windows-aarch64, path: dist/hxmc-haxe-windows-aarch64.zip, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: lix, path: dist/lix/, retention-days: 14}

      # the npm packages (packages/): @hxmc/cli, its six platform packages,
      # @hxmc/wasm and @hxmc/source, at one version: the tag's (v*), a nightly
      # prerelease on main, packages/cli/package.json's elsewhere; and in
      # bin/npm/packages/ the source-only packages at their own versions
      - name: The npm packages
        run: |
          set -ex
          v=$(node -p "require('./packages/cli/package.json').version")
          case "$GITHUB_REF" in
            refs/tags/v*) v=${GITHUB_REF_NAME#v} ;;
            refs/heads/main) v=$v-nightly.$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD) ;;
          esac
          make npm NPM_VERSION=$v
          echo "$v" > bin/npm/VERSION
          # -lib from node_modules (and the npm job's copy of the test)
          make test-node-libs
          cp hxmc/test/NodeLibs.hx bin/npm/
          # what WebAssembly programs see of the file system (the npm job on Windows)
          bin/hxmc/hxmc bin/npm/probe.wasm -cp hxmc/test -main WasiProbe -cp bin/hxmc/std --custom-target hxmc -D hxmc.target=wasm32-wasi
      - uses: actions/upload-artifact@v7
        with: {name: npm, path: "bin/npm/*.tgz\nbin/npm/packages/*.tgz\nbin/npm/NodeLibs.hx\nbin/npm/probe.wasm\nbin/npm/VERSION\nbin/npm/sizes.md", retention-days: 7}

      # the website: the playground's WebAssembly, the pages' JavaScript, lix under tools/
      # (the Programs benchmarks: the history on the bench-data branch, bench.yml)
      - name: The website
        run: |
          set -ex
          mkdir -p bin/bench-data
          if git fetch --depth 1 origin bench-data; then git archive FETCH_HEAD | tar -x -C bin/bench-data; fi
          make site LIX_DIR=dist/lix BENCH_DATA=bin/bench-data
          ls -l bin/site bin/site/tools
      - uses: actions/upload-artifact@v7
        with: {name: site, path: bin/site/, retention-days: 7}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: bin/site

      - name: Cross-build hxmc's corpus
        run: |
          set -ex
          for t in $TARGETS wasm32-wasi; do
            bin/hxmc/hxmc -cp hxmc/test -cp haxe/test --run Corpus -v --target $t --stage dist/corpus/$t
          done
          # and with legacy exception handling (-D hxmc.wasm-eh=legacy)
          bin/hxmc/hxmc -cp hxmc/test -cp haxe/test --run Corpus -v --target wasm32-wasi --wasm-eh legacy --stage dist/corpus/wasm32-wasi-legacy
          # and Linux in the dynamic glibc mode (-D hxmc.libc=glibc), checked with readelf
          for t in linux-x86_64 linux-arm64; do
            bin/hxmc/hxmc -cp hxmc/test -cp haxe/test --run Corpus -v --target $t --libc glibc --stage dist/corpus/$t-glibc
            bin/hxmc/hxmc -cp hxmc/test -cp haxe/test --run ElfCheck dist/corpus/$t-glibc --summary "$GITHUB_STEP_SUMMARY"
          done

      # packages/gfx: the triangle's test program for Linux (glibc mode), run by
      # the test job under Mesa's llvmpipe and Xvfb (packages/gfx/test/check.sh)
      - name: The gfx test programs
        run: |
          set -ex
          for t in linux-x86_64 linux-arm64; do
            mkdir -p dist/gfx/$t
            for m in GfxTest Triangle; do
              bin/hxmc/hxmc dist/gfx/$t/$m -cp packages/os/src -cp packages/gfx/src -cp packages/gfx/examples -cp packages/gfx/test -main $m \
                -cp bin/hxmc/std --custom-target hxmc -D hxmc.libc=glibc -D hxmc.target=$t | tail -3
              rm -rf dist/gfx/$t/$m.hxmc
            done
            ls -l dist/gfx/$t
          done

      # hxmc's output does not depend on the host: the tool as a WebAssembly
      # module (under node) builds the corpus for every target, and the tool
      # itself, byte-identical to the native tool
      - name: hxmc as a WebAssembly module, byte-identical output
        run: make crosshost

      - name: The port as a WebAssembly module
        run: |
          set -ex
          mkdir -p dist/wasm
          HXMC_STATS=1 bin/hxmc/hxmc dist/wasm/haxe.wasm -cp haxe/src -main haxe.Main -D disable-parallelism -cp bin/hxmc/std --custom-target hxmc -D hxmc.target=wasm32-wasi | tail -3
          HXMC_STATS=1 bin/hxmc/hxmc dist/wasm/haxe-legacy.wasm -cp haxe/src -main haxe.Main -D disable-parallelism -cp bin/hxmc/std --custom-target hxmc -D hxmc.target=wasm32-wasi -D hxmc.wasm-eh=legacy | tail -3
          ls -l dist/wasm/haxe.wasm dist/wasm/haxe-legacy.wasm

      # the reference's self-compile, in the directory the macOS runners use
      - name: Reference self-compile
        run: |
          set -ex
          sudo mkdir -p "$SELF_ROOT" && sudo chown "$USER" "$SELF_ROOT"
          cp -r haxe/src "$SELF_ROOT/src"
          cp -r haxe/upstream/std "$SELF_ROOT/std"
          (cd "$SELF_ROOT" && HAXE_STD_PATH=std "$GITHUB_WORKSPACE/bin/reference/haxe" -cp src -main haxe.Main -D disable-parallelism --interp --no-output --hxb self-ref.hxb)
          mkdir -p dist/self
          cp "$SELF_ROOT/self-ref.hxb" dist/self/
          # the sources as compiled here (a Windows checkout would have CRLF
          # line ends, and other positions)
          tar czf dist/self/std.tar.gz -C haxe/upstream std
          tar czf dist/self/src.tar.gz -C haxe src

      # peak memory and time: the self-compile (ours and the reference), the
      # cold native build of the port, the stage0 and the npm package's
      # WebAssembly compiler building native compilers
      - name: Memory and time
        if: always()
        run: |
          set -ex
          {
            echo "### Builds"
            echo ""
            echo "| | |"
            echo "| --- | ---: |"
            echo "| clean bootstrap from the stage0 (stage0 under node, the tool from source, the fixpoint) | ${BOOTSTRAP_SECONDS} s |"
            echo ""
            cat bin/npm/sizes.md || true
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          bin/hxmc/hxmc -cp haxe/test -cp hxmc/test --run Measure --port bin/release/linux-x86_64/haxe

      - name: Pack the corpus
        run: |
          for t in $TARGETS wasm32-wasi wasm32-wasi-legacy linux-x86_64-glibc linux-arm64-glibc; do tar czf dist/corpus-$t.tar.gz -C dist/corpus/$t .; done
          for t in linux-x86_64 linux-arm64; do tar czf dist/gfx-$t.tar.gz -C dist/gfx/$t .; done
          tar czf dist/corpus-wasm32-wasi-port.tar.gz -C dist/wasm haxe.wasm haxe-legacy.wasm
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-self, path: dist/self/, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-linux-x86_64, path: dist/corpus-linux-x86_64.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-linux-arm64, path: dist/corpus-linux-arm64.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-linux-x86_64-glibc, path: dist/corpus-linux-x86_64-glibc.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-linux-arm64-glibc, path: dist/corpus-linux-arm64-glibc.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: gfx-linux-x86_64, path: dist/gfx-linux-x86_64.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: gfx-linux-arm64, path: dist/gfx-linux-arm64.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-windows-x86_64, path: dist/corpus-windows-x86_64.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-windows-arm64, path: dist/corpus-windows-arm64.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-macos-x86_64, path: dist/corpus-macos-x86_64.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-macos-arm64, path: dist/corpus-macos-arm64.tar.gz, retention-days: 3}
      - uses: actions/upload-artifact@v7
        with: {name: corpus-wasm32-wasi, path: "dist/corpus-wasm32-wasi*.tar.gz", retention-days: 3}

  # the port against the reference compiler (README.md, "Testing")
  conformance:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [hxb, macro, display, server, jsonrpc, targets, haxelib, debugger, fuzz]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with: {name: hxmc-haxe-linux-x86_64, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: lix, path: dl/lix}
      - name: Reference compiler revision
        id: ref
        run: echo "rev=$(git rev-parse --short=7 HEAD:haxe/upstream)" >> "$GITHUB_OUTPUT"
      - name: Cache the reference compiler
        uses: actions/cache@v6
        with:
          path: bin/reference
          key: reference-nightly-${{ steps.ref.outputs.rev }}
      - name: The port, lix and the reference
        run: |
          set -ex
          mkdir -p bin/port bin/lix
          tar xzf dl/hxmc-haxe-linux-x86_64.tar.gz -C dl
          cp dl/hxmc-haxe-linux-x86_64/haxe bin/port/haxe
          cp dl/lix/lix-linux-x86_64 bin/lix/lix && chmod +x bin/lix/lix bin/port/haxe
          for cmd in haxe haxelib neko; do ln -sf lix bin/lix/$cmd; done
          touch -d '2000-01-01' bin/lix/lix
          if [ ! -x bin/reference/haxe ]; then make -o bin/lix/lix reference; fi
          bin/reference/haxe -version
          bin/port/haxe -version
      - name: ${{ matrix.suite }}
        run: |
          set -ex
          export HAXE_REFERENCE=$PWD/bin/reference/haxe HAXE_IN_HAXE_PORT=$PWD/bin/port/haxe
          S="bin/port/haxe -cp hxmc/test -cp haxe/test --run"
          case "${{ matrix.suite }}" in
            hxb) $S Conformance -j 4 --summary "$GITHUB_STEP_SUMMARY" ;;
            macro) $S Conformance -j 4 --cases haxe/test/conformance-macro-cases.txt --summary "$GITHUB_STEP_SUMMARY" ;;
            display) $S Display -j 4 --summary "$GITHUB_STEP_SUMMARY" ;;
            server) $S Server -j 4 --summary "$GITHUB_STEP_SUMMARY" ;;
            jsonrpc) $S ServerJsonRpc --summary "$GITHUB_STEP_SUMMARY" ;;
            targets) $S UpstreamTargets -j 4 --summary "$GITHUB_STEP_SUMMARY" ;;
            haxelib) $S Haxelib --server --summary "$GITHUB_STEP_SUMMARY" ;;
            debugger) $S EvalDebugger --summary "$GITHUB_STEP_SUMMARY" ;;
            # the generators' diff lanes (the targets that need no library)
            fuzz)
              for lane in diff:hxb diff:interp diff:js diff:lua diff:python diff:php diff:neko diff:hl diff:hlc diff:swf; do
                bin/port/haxe -cp haxe/test/fuzz -cp haxe/test --run Fuzz -j 4 -n 100 --port $PWD/bin/port/haxe --lane $lane
              done ;;
          esac

  # on a machine of each target: the release binary, lix, hxmc's corpus and
  # the port's self-compile; the scripts run on the release binary's Eval
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64, pkg: linux-x86_64, os: ubuntu-24.04}
          - {target: linux-arm64, pkg: linux-aarch64, os: ubuntu-24.04-arm}
          - {target: windows-x86_64, pkg: windows-x86_64, os: windows-2025}
          - {target: windows-arm64, pkg: windows-aarch64, os: windows-11-arm}
          - {target: macos-x86_64, pkg: macos-x86_64, os: macos-15-intel}
          - {target: macos-arm64, pkg: macos-aarch64, os: macos-15}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            hxmc/test
            haxe/test
            packages/gfx/test
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with: {name: 'hxmc-haxe-${{ matrix.pkg }}', path: dl}
      - uses: actions/download-artifact@v8
        with: {name: 'corpus-${{ matrix.target }}', path: dl}
      - uses: actions/download-artifact@v8
        with: {name: hxmc-self, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: lix, path: lix}
      - name: Unpack
        id: unpack
        run: |
          set -ex
          mkdir -p t corpus std-x
          case "${{ matrix.target }}" in
            windows-*)
              unzip -q dl/hxmc-haxe-${{ matrix.pkg }}.zip -d t
              echo "bin=$PWD/t/hxmc-haxe-${{ matrix.pkg }}/haxe.exe" >> "$GITHUB_OUTPUT"
              # a Windows path (C:/...) for the native program
              echo "std=$(cygpath -m "$PWD/t/hxmc-haxe-${{ matrix.pkg }}/std")" >> "$GITHUB_OUTPUT" ;;
            *)
              tar xzf dl/hxmc-haxe-${{ matrix.pkg }}.tar.gz -C t
              echo "bin=$PWD/t/hxmc-haxe-${{ matrix.pkg }}/haxe" >> "$GITHUB_OUTPUT"
              echo "std=$PWD/t/hxmc-haxe-${{ matrix.pkg }}/std" >> "$GITHUB_OUTPUT" ;;
          esac
          tar xzf dl/corpus-${{ matrix.target }}.tar.gz -C corpus
          tar xzf dl/std.tar.gz -C std-x
          tar xzf dl/src.tar.gz -C std-x
          ls -l t/*
      - name: Smoke test
        run: |
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          SMOKE_DIR="$RUNNER_TEMP/smoke" sh hxmc/test/smoke.sh "${{ steps.unpack.outputs.bin }}"
      - name: Smoke test (PowerShell, Windows paths)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HAXE_STD_PATH = (Resolve-Path "t/hxmc-haxe-${{ matrix.pkg }}/std").Path
          $exe = (Resolve-Path "t/hxmc-haxe-${{ matrix.pkg }}/haxe.exe").Path
          New-Item -ItemType Directory -Force ps | Out-Null
          Set-Location ps
          Set-Content Main.hx 'class Main { static function main() { trace("hello from " + #if sys Sys.systemName() + " in " + Sys.getCwd() #else "js" #end); } }'
          $out = & $exe -main Main --interp
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out
          # the native build's Eval host: Windows, with a drive letter
          if (-not ($out -match "hello from Windows in [A-Z]:\\")) { exit 1 }
          & $exe -main Main --js out.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node out.js
          & $exe -cp . -main Main --hxb out.hxb
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item out.hxb
      - name: lix
        run: |
          set -ex
          # installed as the site says: the platform's binary as lix, then lix shims
          # (a POSIX path for bash: on Windows, MSYS converts PATH for native programs)
          B="$RUNNER_TEMP/lix-bin"
          if [ "$RUNNER_OS" = Windows ]; then B=$(cygpath -u "$B"); fi
          mkdir -p "$B"
          if [ "$RUNNER_OS" = Windows ]; then
            cp lix/lix-${{ matrix.target }}.exe "$B/lix.exe"; L="$B/lix.exe"; H="$B/haxe.exe"
          else
            cp lix/lix-${{ matrix.target }} "$B/lix"; chmod +x "$B/lix"; L="$B/lix"; H="$B/haxe"
          fi
          "$L" --version
          "$L" shims
          ls -l "$B"
          # the commands on PATH (the libraries' install commands call lix)
          export PATH="$B:$PATH"
          export HAXESHIM_ROOT="$RUNNER_TEMP/lix-root"
          mkdir -p "$RUNNER_TEMP/lix-project/src" && cd "$RUNNER_TEMP/lix-project"
          "$L" scope create
          # downloads from GitHub's and haxe.org's servers stall now and then on the
          # runners (no data for 30 s, or a TCP timeout): tried again, as a person would
          retry() { for n in 1 2 3; do "$@" && return 0; echo "retry: $* failed (try $n)"; sleep 10; done; return 1; }
          # Haxe and neko have no Windows ARM64 builds, and lix (as upstream's)
          # maps no platform there ("Unsupported platform: unknown"): no downloads
          if [ "${{ matrix.target }}" = windows-arm64 ]; then exit 0; fi
          retry "$L" download
          retry "$L" install haxelib:tink_core
          cat haxe_libraries/tink_core.hxml .haxerc
          # a fresh clone's case: the libraries reinstalled from haxe_libraries
          retry "$L" install haxelib:tink_json
          rm -rf "$HAXESHIM_ROOT/haxe_libraries"
          retry "$L" download
          echo 'class Main { static function main() trace(tink.core.Outcome.Success(#if sys Sys.args() #else "js" #end)); }' > src/Main.hx
          # Haxe 4.3.7 has no Linux ARM64 build: lix (as the npm package)
          # downloads the x86-64 one there, which does not run
          if [ "${{ matrix.target }}" = linux-arm64 ]; then "$H" --run resolve-args -lib tink_json; exit 0; fi
          "$H" -version
          "$H" --run resolve-args -lib tink_core
          "$H" --run resolve-args -lib tink_json
          "$H" -cp src -lib tink_core --run Main a b
          "$H" -cp src -lib tink_core -main Main --js main.js && node main.js
      - name: Corpus
        if: always()
        run: |
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run Check corpus --summary "$GITHUB_STEP_SUMMARY"
      # the free nursery filled with a pattern: allocations that are not
      # initialized and references a collection missed read it at once
      - name: Corpus, RT_VERIFY=1
        if: always()
        run: |
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          RT_VERIFY=1 "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run Check corpus --summary "$GITHUB_STEP_SUMMARY"
      # Linux: the corpus in the dynamic glibc mode (-D hxmc.libc=glibc) against
      # the runner's glibc, and against glibc 2.17, the floor its symbol
      # versions are pinned to (CentOS 7's, in a container; the release
      # binary that runs the check is static)
      - uses: actions/download-artifact@v8
        if: runner.os == 'Linux'
        with: {name: 'corpus-${{ matrix.target }}-glibc', path: dl}
      - name: Corpus, glibc mode
        if: always() && runner.os == 'Linux'
        run: |
          set -ex
          mkdir -p corpus-glibc
          tar xzf dl/corpus-${{ matrix.target }}-glibc.tar.gz -C corpus-glibc
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run ElfCheck corpus-glibc
          "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run Check corpus-glibc --summary "$GITHUB_STEP_SUMMARY"
          RT_VERIFY=1 "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run Check corpus-glibc --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus, glibc mode, glibc 2.17
        if: always() && runner.os == 'Linux'
        run: |
          set -ex
          docker run --rm --network host -v "$PWD:/w" -w /w -e HAXE_STD_PATH=/w/t/hxmc-haxe-${{ matrix.pkg }}/std centos:7 \
            sh -c 'ldd --version | head -1 && t/hxmc-haxe-${{ matrix.pkg }}/haxe -cp hxmc/test -cp haxe/test --run Check corpus-glibc'
      # packages/gfx: the triangle headless and in an X11 window, on Mesa's
      # llvmpipe (no GPU), against the golden image
      - uses: actions/download-artifact@v8
        if: runner.os == 'Linux'
        with: {name: 'gfx-${{ matrix.target }}', path: dl}
      - name: gfx (Mesa llvmpipe, Xvfb)
        if: always() && runner.os == 'Linux'
        run: |
          set -ex
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 xvfb xauth
          mkdir -p gfx
          tar xzf dl/gfx-${{ matrix.target }}.tar.gz -C gfx
          sh packages/gfx/test/check.sh gfx
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Linux'
        with: {name: 'gfx-images-${{ matrix.target }}', path: gfx/*.png, retention-days: 7}
      - name: Port self-compile
        if: always()
        run: |
          set -ex
          root="$SELF_ROOT"
          exe="${{ steps.unpack.outputs.bin }}"
          if [ "$RUNNER_OS" = Linux ]; then sudo mkdir -p "$root" && sudo chown "$USER" "$root"; fi
          if [ "$RUNNER_OS" = Windows ]; then root="$(cygpath -w "$RUNNER_TEMP")\\hih"; fi
          if [ "$RUNNER_OS" = Windows ]; then exe="$(cygpath -m "$exe")"; fi
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          # (MSYS would rewrite the reference's root, a POSIX path)
          MSYS_NO_PATHCONV=1 "$exe" -cp hxmc/test -cp haxe/test --run Selfcheck --port "$exe" --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$root" --summary "$GITHUB_STEP_SUMMARY"

  # the WebAssembly corpus under node 22 and wasmtime, the port as a module
  # compiling itself under both, and the playground in the browsers' engines
  wasm:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            hxmc/test
            haxe/test
            hxmc/bootstrap
            hxmc/web/tools
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: wasmtime
        run: |
          set -ex
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/v$WASMTIME_VERSION/wasmtime-v$WASMTIME_VERSION-x86_64-linux.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v$WASMTIME_VERSION-x86_64-linux" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with: {name: corpus-wasm32-wasi, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: hxmc-self, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: site, path: site-dist}
      - uses: actions/download-artifact@v8
        with: {name: hxmc-haxe-linux-x86_64, path: dl}
      - name: Unpack
        run: |
          set -ex
          mkdir -p corpus corpus-legacy port std-x
          tar xzf dl/corpus-wasm32-wasi.tar.gz -C corpus
          tar xzf dl/corpus-wasm32-wasi-legacy.tar.gz -C corpus-legacy
          tar xzf dl/corpus-wasm32-wasi-port.tar.gz -C port
          tar xzf dl/std.tar.gz -C std-x
          tar xzf dl/src.tar.gz -C std-x
          tar xzf dl/hxmc-haxe-linux-x86_64.tar.gz -C dl
          echo "H=$PWD/dl/hxmc-haxe-linux-x86_64/haxe" >> "$GITHUB_ENV"
          echo "HAXE_STD_PATH=$PWD/dl/hxmc-haxe-linux-x86_64/std" >> "$GITHUB_ENV"
          echo "NODE_WASI=node --no-warnings --stack-size=8000 $PWD/hxmc/bootstrap/wasi.mjs" >> "$GITHUB_ENV"
          sudo mkdir -p "$SELF_ROOT" && sudo chown "$USER" "$SELF_ROOT"
      - name: Corpus under node
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Check corpus --runner "$NODE_WASI" --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus under node, RT_VERIFY=1
        if: always()
        run: RT_VERIFY=1 $H -cp hxmc/test -cp haxe/test --run Check corpus --runner "$NODE_WASI" --summary "$GITHUB_STEP_SUMMARY"
      # built with -D hxmc.wasm-eh=legacy (try/catch_all/rethrow, for engines
      # without exnref), under node without exnref
      - name: Corpus under node, legacy exception handling
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Check corpus-legacy --runner "env HXMC_WASM_EXNREF=0 $NODE_WASI" --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus under wasmtime
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Check corpus --runner "wasmtime run -W exceptions=y --dir . --dir / --env RT_MINOR_KB" --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus under wasmtime, 16 KB nursery
        if: always()
        run: RT_MINOR_KB=16 $H -cp hxmc/test -cp haxe/test --run Check corpus --runner "wasmtime run -W exceptions=y --dir . --dir / --env RT_MINOR_KB" --summary "$GITHUB_STEP_SUMMARY"
      - name: Port self-compile under node
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Selfcheck --runner "$NODE_WASI" --port port/haxe.wasm --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$SELF_ROOT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Port self-compile under node, legacy exception handling
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Selfcheck --runner "env HXMC_WASM_EXNREF=0 $NODE_WASI" --port port/haxe-legacy.wasm --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$SELF_ROOT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Port self-compile under wasmtime
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Selfcheck --runner "wasmtime run -W exceptions=y -W max-wasm-stack=67108864 --dir / --env HAXE_STD_PATH --env PWD" --port port/haxe.wasm --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$SELF_ROOT" --summary "$GITHUB_STEP_SUMMARY"
      # the playground's worker (hxmc/web/src/Worker.hx, WasiHost.hx) in the
      # browsers' engines: --interp, HXB, diagnostics and completion, with both
      # modules (exnref, legacy exception handling); the page's choice of
      # module, also in a Chromium without exnref
      - name: Playground in Chromium, Firefox and WebKit
        if: always()
        run: |
          set -ex
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit > /dev/null
          node hxmc/web/tools/browser-test.mjs site-dist chromium firefox webkit

  # the npm packages in fresh projects, on each target's machine (every
  # package installed before publish-npm publishes them): @hxmc/cli with its
  # platform package (native at once, node_modules/.bin/haxe the native
  # compiler on Unix; -lib from node_modules; with --ignore-scripts after the
  # first call), lix with
  # dist/; the WebAssembly fallback (no platform package: @hxmc/wasm downloaded
  # into the cache, here from the local tarball through HXMC_WASM_TARBALL, or
  # installed); @hxmc/source (an edit, hxmc-rebuild, haxe runs the rebuilt
  # compiler, --reset)
  npm:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, plat: linux-x64, lix: linux-x86_64}
          - {os: ubuntu-24.04-arm, plat: linux-arm64}
          - {os: macos-15, plat: darwin-arm64, lix: macos-arm64}
          - {os: macos-15-intel, plat: darwin-x64}
          - {os: windows-2025, plat: win32-x64}
          - {os: windows-11-arm, plat: win32-arm64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      HXMC_CACHE: ${{ github.workspace }}/hxmc-cache
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with: {name: npm, path: dl}
      - uses: actions/download-artifact@v8
        if: matrix.lix
        with: {name: lix, path: dl/lix}
      - name: Install @hxmc/cli and its platform package
        run: |
          set -ex
          v=$(cat dl/VERSION)
          mkdir -p "$RUNNER_TEMP/app/src" && cd "$RUNNER_TEMP/app"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/dl/hxmc-cli-$v.tgz" "$GITHUB_WORKSPACE/dl/hxmc-${{ matrix.plat }}-$v.tgz"
          printf 'class Main { static function main() { Sys.println("hello from " + Sys.systemName()); } }\n' > src/Main.hx
          printf 'class Js { static function main() { trace("hello from js"); } }\n' > src/Js.hx
          printf -- '-cp src\n-main Main\n--custom-target hxmc=bin/app\n' > build.hxml
          # (no compiler sources and no WebAssembly compiler in @hxmc/cli)
          test ! -e node_modules/@hxmc/cli/haxe/src && test ! -e node_modules/@hxmc/cli/hxmc/bootstrap/haxe.wasm
          # Unix: the postinstall put the native compiler where npm's link points
          if [ "$RUNNER_OS" != Windows ]; then head -c 4 node_modules/.bin/haxe | od -An -tx1 | tee magic.txt; ! grep -q "23 21" magic.txt; fi
      - name: Native at once
        run: |
          set -ex
          cd "$RUNNER_TEMP/app"
          npx haxe --version > version.out 2> version.err
          cat version.out
          test ! -s version.err
          test ! -e "$HXMC_CACHE/npm"
          npx haxe -cp src -main Main --interp | tee out.txt
          grep -q "hello from" out.txt
          time npx haxe build.hxml
          if [ "$RUNNER_OS" = Windows ]; then ./bin/app.exe; ls -l node_modules/@hxmc/cli/dist/haxe.exe; else ./bin/app; fi
          npx haxe -cp src -main Js --js main.js && node main.js
      # -lib from node_modules (hxmc/test/NodeLibs.hx), by the native compiler
      # run without node (npm's link to it on Unix, dist/haxe.exe on Windows)
      - name: -lib from node_modules
        run: |
          set -ex
          cd "$RUNNER_TEMP/app"
          if [ "$RUNNER_OS" = Windows ]; then hx="$PWD/node_modules/@hxmc/cli/dist/haxe.exe"; else hx="$PWD/node_modules/.bin/haxe"; fi
          "$hx" -cp "$GITHUB_WORKSPACE/dl" --run NodeLibs --haxe "$hx" --dir "$RUNNER_TEMP/node-libs"
      - name: With --ignore-scripts, the first call installs the native compiler
        if: runner.os != 'Windows'
        run: |
          set -ex
          v=$(cat dl/VERSION)
          mkdir -p "$RUNNER_TEMP/noscripts" && cd "$RUNNER_TEMP/noscripts"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE/dl/hxmc-cli-$v.tgz" "$GITHUB_WORKSPACE/dl/hxmc-${{ matrix.plat }}-$v.tgz"
          head -c 2 node_modules/.bin/haxe | grep -q '#!'
          npx haxe --version
          head -c 4 node_modules/.bin/haxe | od -An -tx1 | tee magic.txt; ! grep -q "23 21" magic.txt
      # lix with the package's installation (dist/) as its Haxe
      - name: lix
        if: matrix.lix
        run: |
          set -ex
          cd "$RUNNER_TEMP/app"
          export HAXESHIM_ROOT="$RUNNER_TEMP/lix-root"
          mkdir -p "$RUNNER_TEMP/lix" && cp "$GITHUB_WORKSPACE/dl/lix/lix-${{ matrix.lix }}" "$RUNNER_TEMP/lix/lix" && chmod +x "$RUNNER_TEMP/lix/lix"
          export PATH="$RUNNER_TEMP/lix:$PATH"
          lix shims
          lix scope create
          lix use haxe ./node_modules/@hxmc/cli/dist
          cat .haxerc
          haxe --version
          printf -- '-cp src\n-main Main\n--custom-target hxmc=bin/applix\n' > lix.hxml
          haxe lix.hxml
          ./bin/applix
      # the WebAssembly fallback: without a native compiler (no platform
      # package) the first call downloads @hxmc/wasm into the cache, checked
      # against the integrity @hxmc/cli pins (the local tarball here: this
      # version is not on the registry yet)
      - name: WebAssembly fallback, downloaded
        env:
          HXMC_PLATFORM_PACKAGE: '0'
          HXMC_CACHE: ${{ github.workspace }}/hxmc-cache-wasm
        run: |
          set -ex
          v=$(cat dl/VERSION)
          mkdir -p "$RUNNER_TEMP/fallback/src" && cd "$RUNNER_TEMP/fallback"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/dl/hxmc-cli-$v.tgz"
          cp "$RUNNER_TEMP/app/src/Main.hx" src/
          # offline: one line on stderr, a non-zero exit
          if HXMC_WASM_TARBALL="$RUNNER_TEMP/missing.tgz" npx haxe --version > off.out 2> off.err; then exit 1; fi
          cat off.err; grep -q "could not be downloaded" off.err; test ! -s off.out
          # a tarball that is not the pinned one
          if HXMC_WASM_TARBALL="$GITHUB_WORKSPACE/dl/hxmc-source-$v.tgz" npx haxe --version 2> bad.err; then exit 1; fi
          grep -q "integrity mismatch" bad.err
          export HXMC_WASM_TARBALL="$GITHUB_WORKSPACE/dl/hxmc-wasm-$v.tgz"
          npx haxe --version > version.out 2> version.err
          cat version.out version.err
          test ! -s version.err
          test -f "$HXMC_CACHE/npm/$v/wasm/haxe.wasm"
          # (from the cache now)
          HXMC_WASM_TARBALL="$RUNNER_TEMP/missing.tgz" npx haxe -cp src -main Main --custom-target hxmc=bin/app
          if [ "$RUNNER_OS" = Windows ]; then ./bin/app.exe; else ./bin/app; fi
          npx haxe -cp src -main Main --interp | tee out.txt
          grep -q "hello from Wasi" out.txt
      # @hxmc/wasm installed (WebContainers, noexec sandboxes): used, nothing downloaded
      - name: WebAssembly fallback, installed
        env:
          HXMC_PLATFORM_PACKAGE: '0'
          HXMC_CACHE: ${{ github.workspace }}/hxmc-cache-wasm2
          HXMC_WASM_TARBALL: ${{ runner.temp }}/missing.tgz
        run: |
          set -ex
          v=$(cat dl/VERSION)
          mkdir -p "$RUNNER_TEMP/wasmpkg/src" && cd "$RUNNER_TEMP/wasmpkg"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/dl/hxmc-cli-$v.tgz" "$GITHUB_WORKSPACE/dl/hxmc-wasm-$v.tgz"
          cp "$RUNNER_TEMP/app/src/Main.hx" src/
          npx haxe -cp src -main Main --interp | tee out.txt
          grep -q "hello from Wasi" out.txt
          test ! -e "$HXMC_CACHE/npm"
          # -lib from node_modules, by the WebAssembly compiler
          mkdir -p node_modules/hxdemo/src/demo
          printf '{"name": "hxdemo", "version": "1.0.0", "haxe": {"name": "hxdemo", "classPath": "src"}}\n' > node_modules/hxdemo/package.json
          printf 'package demo;\nclass Demo {\n\tpublic static function hi() return "hi from node_modules";\n}\n' > node_modules/hxdemo/src/demo/Demo.hx
          printf 'class UseDemo {\n\tstatic function main() Sys.println(demo.Demo.hi());\n}\n' > src/UseDemo.hx
          npx haxe -cp src -lib hxdemo -main UseDemo --interp | tee demo.txt
          grep -q "hi from node_modules" demo.txt
      # @hxmc/source: hxmc-rebuild builds the edited compiler with the native
      # one, haxe runs it while @hxmc/source is installed, --reset returns to
      # the published one
      - name: hxmc-rebuild
        env:
          HXMC_CACHE: ${{ github.workspace }}/hxmc-cache-source
        run: |
          set -ex
          v=$(cat dl/VERSION)
          mkdir -p "$RUNNER_TEMP/source/src" && cd "$RUNNER_TEMP/source"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/dl/hxmc-cli-$v.tgz" "$GITHUB_WORKSPACE/dl/hxmc-${{ matrix.plat }}-$v.tgz" "$GITHUB_WORKSPACE/dl/hxmc-source-$v.tgz"
          cp "$RUNNER_TEMP/app/src/Main.hx" src/
          sed -i.bak 's/"preview\.1"/"preview.1.rebuilt"/' node_modules/@hxmc/source/haxe/src/core/Globals.hx
          grep -q rebuilt node_modules/@hxmc/source/haxe/src/core/Globals.hx
          time npx hxmc-rebuild
          npx haxe --version | tee version.out
          grep -q "rebuilt" version.out
          npx haxe -cp src -main Main --custom-target hxmc=bin/app
          if [ "$RUNNER_OS" = Windows ]; then ./bin/app.exe; else ./bin/app; fi
          npx hxmc-rebuild --reset
          npx haxe --version | tee version.out
          ! grep -q "rebuilt" version.out
          if [ "$RUNNER_OS" != Windows ]; then head -c 4 node_modules/.bin/haxe | od -An -tx1 | tee magic.txt; ! grep -q "23 21" magic.txt; fi

  # upstream Haxe's compiler-side suite (RunCi macro) with the release
  # binaries as haxe (upstream-tests.yml)
  upstream-tests:
    needs: build
    uses: ./.github/workflows/upstream-tests.yml

  # npm: the nine packages at one version (the build job's), installed and
  # tested by the npm job: the six platform packages, @hxmc/wasm,
  # @hxmc/source, then @hxmc/cli: on v* tags (dist-tag latest) and pushes to main (a nightly, dist-tag
  # next); then every source-only package (packages/<name> with a version of
  # its own: bin/npm/packages/) at its version when that is not on npm yet
  # (dist-tag latest, next for a prerelease); never from other branches
  publish-npm:
    needs: [build, npm, test, wasm, conformance]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with: {name: npm, path: dl}
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -ex
          v=$(cat dl/VERSION)
          tag=latest
          case "$GITHUB_REF" in refs/heads/main) tag=next ;; esac
          # a tarball's path starts with ./ (npm reads dl/x.tgz as a GitHub
          # user/repo); versions already published are skipped, so a run that
          # stopped halfway can be run again
          publish() {
            if npm view "$1@$v" version >/dev/null 2>&1; then echo "$1@$v is published already"; return; fi
            npm publish --access public --provenance --tag $tag "$2"
          }
          # (all nine at this version, each one's dependencies first: @hxmc/cli
          # last, whose optional dependencies and pinned @hxmc/wasm must exist)
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64 wasm source cli; do
            test "$(tar xzf "dl/hxmc-$p-$v.tgz" -O package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')" = "$v"
          done
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64 wasm source cli; do
            publish "@hxmc/$p" "./dl/hxmc-$p-$v.tgz"
          done
          # the source-only packages, at their own versions
          for f in dl/packages/*.tgz; do
            test -e "$f" || continue
            meta=$(tar xzf "$f" -O package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); p.name + " " + p.version')
            name=${meta% *} pv=${meta#* }
            if npm view "$name@$pv" version >/dev/null 2>&1; then echo "$name@$pv is published already"; continue; fi
            case "$pv" in *-*) ptag=next ;; *) ptag=latest ;; esac
            npm publish --access public --provenance --tag $ptag "./$f"
          done

  # nightly on main, a release on v* tags
  release:
    needs: [test, wasm, npm, conformance]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hxmc-haxe-*
          path: assets
          merge-multiple: true
      - name: The npm package
        uses: actions/download-artifact@v8
        with: {name: npm, path: npm}
      - name: Publish
        run: |
          set -ex
          cp npm/hxmc-cli-$(cat npm/VERSION).tgz assets/
          ls -l assets
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-9)
          NOTES="Built from $GITHUB_SHA by hxmc (the port compiled to machine code for each target, cross-built on Linux, with mbedtls and libuv).

          - hxmc-haxe-<os>-<arch>.tar.gz: Linux and macOS, haxe with std/; set HAXE_STD_PATH to it.
          - hxmc-haxe-windows-<arch>.zip: Windows, haxe.exe with std/; set HAXE_STD_PATH to it.
          - hxmc-cli-<version>.tgz: the npm package @hxmc/cli (its platform packages, @hxmc/wasm and @hxmc/source are on npm).

          Each archive carries the licenses: LICENSE and COPYING (the port), LICENSE.mbedtls and LICENSE.libuv."
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
            gh release create "$TAG" --verify-tag --title "hxmc $TAG" --notes "$NOTES" assets/*
          else
            TAG=nightly
            if gh release view "$TAG" > /dev/null 2>&1; then
              # move the tag, then replace the assets in place (the download URLs stay valid)
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
              gh release upload "$TAG" assets/* --clobber
              gh release edit "$TAG" --prerelease --title "Nightly ($SHORT)" --notes "$NOTES"
            else
              gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Nightly ($SHORT)" --notes "$NOTES" assets/*
            fi
          fi

  pages:
    needs: [build, wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
